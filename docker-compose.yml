services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-benchmark-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-benchmark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-benchmark}
      POSTGRES_DB: ${POSTGRES_DB:-agent_benchmark}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-benchmark} -d ${POSTGRES_DB:-agent_benchmark}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: agent-benchmark-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://benchmark:benchmark@postgres:5432/agent_benchmark}
      DATABASE_AUTO_CREATE_TABLES: ${DATABASE_AUTO_CREATE_TABLES:-false}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-python:3.12-slim}
      SANDBOX_WORKSPACE_ROOT: /sandbox-workspaces
      SANDBOX_RETAIN_WORKSPACES: ${SANDBOX_RETAIN_WORKSPACES:-false}
      SANDBOX_MEMORY_LIMIT: ${SANDBOX_MEMORY_LIMIT:-1g}
      SANDBOX_CPU_LIMIT: ${SANDBOX_CPU_LIMIT:-1.0}
      SANDBOX_PIDS_LIMIT: ${SANDBOX_PIDS_LIMIT:-256}
      SANDBOX_COMMAND_TIMEOUT_SECONDS: ${SANDBOX_COMMAND_TIMEOUT_SECONDS:-120}
      SANDBOX_CLONE_TIMEOUT_SECONDS: ${SANDBOX_CLONE_TIMEOUT_SECONDS:-120}
      SANDBOX_MAX_COMMAND_TIMEOUT_SECONDS: ${SANDBOX_MAX_COMMAND_TIMEOUT_SECONDS:-600}
      SANDBOX_NETWORK_ENABLED: ${SANDBOX_NETWORK_ENABLED:-false}
      SANDBOX_PULL_IMAGE: ${SANDBOX_PULL_IMAGE:-true}
      SANDBOX_MAX_OUTPUT_BYTES: ${SANDBOX_MAX_OUTPUT_BYTES:-200000}
      PATCH_MAX_BYTES: ${PATCH_MAX_BYTES:-1000000}
      PATCH_MAX_CHANGED_FILES: ${PATCH_MAX_CHANGED_FILES:-100}
      ENABLE_REAL_MODEL_CALLS: ${ENABLE_REAL_MODEL_CALLS:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_DEFAULT_MODEL: ${OPENAI_DEFAULT_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_DEFAULT_MODEL: ${ANTHROPIC_DEFAULT_MODEL:-claude-sonnet-5}
      ENABLE_LOCAL_MODEL_CALLS: ${ENABLE_LOCAL_MODEL_CALLS:-false}
      LOCAL_MODEL_ENDPOINT: ${LOCAL_MODEL_ENDPOINT:-}
      LOCAL_MODEL_API_KEY: ${LOCAL_MODEL_API_KEY:-}
      LOCAL_MODEL_DEFAULT_MODEL: ${LOCAL_MODEL_DEFAULT_MODEL:-local-model}
      LOCAL_MODEL_TIMEOUT_SECONDS: ${LOCAL_MODEL_TIMEOUT_SECONDS:-120}
      ENABLE_REAL_EMBEDDINGS: ${ENABLE_REAL_EMBEDDINGS:-false}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-mock}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      EMBEDDING_VECTOR_DIMENSIONS: ${EMBEDDING_VECTOR_DIMENSIONS:-}
      EMBEDDING_CHUNK_SIZE_CHARS: ${EMBEDDING_CHUNK_SIZE_CHARS:-1000}
      EMBEDDING_CHUNK_OVERLAP_CHARS: ${EMBEDDING_CHUNK_OVERLAP_CHARS:-100}
      EMBEDDING_AUTO_BUILD: ${EMBEDDING_AUTO_BUILD:-false}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./sandbox-workspaces:/sandbox-workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
    container_name: agent-benchmark-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  postgres_data:
